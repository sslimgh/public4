<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수학 대륙 RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#12163a;color:#fff;min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none}
#app{max-width:980px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}
button{font-family:inherit;cursor:pointer}
.btn{border:none;border-radius:14px;padding:12px 20px;font-size:19px;background:linear-gradient(#ffe06a,#f5a700);color:#4a2a00;box-shadow:0 5px 0 #b06f00;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b06f00}
.btn.blue{background:linear-gradient(#7fd3ff,#2f8cff);color:#fff;box-shadow:0 5px 0 #1b5bb5}
.btn.gray{background:linear-gradient(#e6e8f0,#b9bed0);color:#333;box-shadow:0 5px 0 #8389a0}
.btn.red{background:linear-gradient(#ff8a8a,#e23b3b);color:#fff;box-shadow:0 5px 0 #a11f1f}
.btn:disabled{opacity:.5;cursor:default}

/* 캐릭터 생성 */
.create{padding:28px 18px;text-align:center}
.logo{font-size:44px;line-height:1.15;margin:10px 0 4px;color:#ffe06a;text-shadow:0 4px 0 #b06f00,0 8px 18px rgba(0,0,0,.5)}
.logo small{display:block;font-size:20px;color:#bcd0ff;text-shadow:none;margin-top:8px}
.castle{font-size:72px;animation:bob 2.2s ease-in-out infinite}
.create input{font-family:inherit;font-size:22px;padding:12px 16px;border-radius:14px;border:3px solid #5b6bd6;background:#1e2560;color:#fff;width:min(320px,90%);text-align:center;outline:none}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px auto;max-width:620px}
.cls{background:#1e2560;border:3px solid #34408f;border-radius:18px;padding:14px 8px;color:#fff;font-size:16px}
.cls .e{font-size:54px;display:block}
.cls b{font-size:21px;display:block;margin:4px 0;color:#ffe06a;font-weight:normal}
.cls.sel{border-color:#ffe06a;background:#2c3690;box-shadow:0 0 0 4px rgba(255,224,106,.25)}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(#232a6b,#1a2056);border-bottom:3px solid #0d1030;position:sticky;top:0;z-index:5}
.ava{font-size:38px;width:56px;height:56px;border-radius:50%;background:#2f3a99;display:flex;align-items:center;justify-content:center;border:3px solid #ffe06a;flex:none}
.hinfo{flex:1;min-width:0}
.hname{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{background:#ffe06a;color:#4a2a00;border-radius:8px;padding:0 7px;font-size:15px;margin-left:4px}
.expbar{height:10px;background:#0d1030;border-radius:6px;margin-top:5px;overflow:hidden}
.expbar i{display:block;height:100%;background:linear-gradient(90deg,#6cf0ff,#3a86ff)}
.res{background:#0f1442;border-radius:12px;padding:6px 10px;font-size:16px;white-space:nowrap}
.power{margin:14px 14px 4px;padding:10px 14px;background:rgba(255,255,255,.06);border-radius:14px;font-size:16px;color:#cfe0ff;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center}
.sectit{margin:16px 16px 8px;font-size:22px;color:#ffe06a}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:0 14px}
.stage{position:relative;border:none;border-radius:18px;padding:14px;color:#fff;text-align:left;min-height:122px;box-shadow:0 5px 0 rgba(0,0,0,.35);overflow:hidden}
.stage .ic{font-size:44px;position:absolute;right:10px;top:8px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.stage .no{font-size:14px;opacity:.85}
.stage .nm{font-size:23px;margin:2px 0;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.stage .cp{font-size:14px;opacity:.9}
.stage .stars{font-size:20px;margin-top:6px;color:#ffe06a;letter-spacing:2px}
.stage .stars .off{color:rgba(255,255,255,.3)}
.stage.lock{filter:grayscale(.9) brightness(.55)}
.stage.lock::after{content:'🔒';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(0,0,0,.25)}
.stage.new{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 5px rgba(255,224,106,.55)}}
.menu{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px;background:linear-gradient(transparent,#0b0e2a 30%);z-index:6}
.menu button{flex:1;max-width:150px;border:none;border-radius:16px;padding:8px 4px;background:#2a3388;color:#fff;font-size:15px;box-shadow:0 4px 0 #141a55}
.menu button span{display:block;font-size:26px}

/* 전투 */
.bhead{display:flex;align-items:center;gap:8px;padding:10px 12px}
.bhead .tt{flex:1;font-size:18px;text-align:center}
.iconbtn{border:none;background:#2a3388;color:#fff;border-radius:12px;padding:8px 12px;font-size:16px;box-shadow:0 3px 0 #141a55}
.auto{background:#555b80;opacity:.85}
.waves{display:flex;gap:5px;justify-content:center;margin-top:3px}
.waves i{width:13px;height:13px;border-radius:50%;background:#3b4280;display:inline-block}
.waves i.done{background:#ffe06a}
.waves i.now{background:#ff6b6b;box-shadow:0 0 0 3px rgba(255,107,107,.35)}
.waves i.boss{border-radius:3px;transform:rotate(45deg)}
.arena{position:relative;height:210px;margin:0 12px;border-radius:20px;overflow:hidden;box-shadow:inset 0 -40px 50px rgba(0,0,0,.28)}
.arena::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(0,0,0,.18)}
.unit{position:absolute;bottom:26px;text-align:center;width:150px;z-index:2}
.unit.hero{left:6%}
.unit.mon{right:6%}
.unit .body{display:inline-block}
.unit .e{display:inline-block;font-size:70px;line-height:1;animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 6px 3px rgba(0,0,0,.35))}
.unit.mon .e{font-size:84px;animation-delay:.4s}
.unit.mon.boss .e{font-size:112px}
.unit .lbl{font-size:15px;margin-top:2px;text-shadow:0 2px 2px #000}
.hpbar{height:14px;width:130px;margin:0 auto 6px;background:rgba(0,0,0,.55);border-radius:8px;overflow:hidden;border:2px solid rgba(0,0,0,.4);position:relative}
.hpbar i{display:block;height:100%;transition:width .35s}
.hero .hpbar i{background:linear-gradient(90deg,#5dff8f,#22c55e)}
.mon .hpbar i{background:linear-gradient(90deg,#ff7a7a,#e11d48)}
.hpbar b{position:absolute;inset:0;font-size:11px;font-weight:normal;line-height:10px;text-align:center}
.combo{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:26px;color:#ffe06a;text-shadow:0 3px 0 #b06f00;z-index:3;white-space:nowrap}
.combo.pop{animation:pop .35s}
.float{position:absolute;font-size:34px;z-index:4;pointer-events:none;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.6);animation:up 1.1s forwards}
.float.dmg{color:#fff}
.float.crit{color:#ffe14d;font-size:44px}
.float.ouch{color:#ff6b6b}
.float.gold{color:#ffd54a;font-size:24px}
.float.exp{color:#7fe3ff;font-size:22px}
.float.heal{color:#5dff8f}
.lunge{animation:lunge .45s}
.mlunge{animation:mlunge .45s}
.hit{animation:hit .4s}
.die{animation:die .7s forwards}
.appear{animation:appear .5s}
.redflash{position:absolute;inset:0;background:rgba(255,0,0,.35);z-index:3;animation:fade .45s forwards;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes lunge{40%{transform:translateX(min(34vw,300px)) scale(1.15)}}
@keyframes mlunge{40%{transform:translateX(max(-34vw,-300px)) scale(1.15)}}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(12px);filter:brightness(3) saturate(0)}45%{transform:translateX(-10px)}70%{transform:translateX(6px)}}
@keyframes die{to{transform:translateY(40px) rotate(35deg) scale(.2);opacity:0}}
@keyframes appear{from{transform:scale(0) translateY(-50px);opacity:0}to{transform:none;opacity:1}}
@keyframes up{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{transform:translate(-50%,-14px) scale(1.25);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
@keyframes pop{50%{transform:translateX(-50%) scale(1.4)}}
@keyframes fade{to{opacity:0}}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(6px,-3px)}50%{transform:translate(-6px,3px)}75%{transform:translate(4px,2px)}}
.shake{animation:shake .3s}

.qcard{background:#fffdf4;color:#2b2d42;border-radius:20px;margin:12px;padding:14px 16px 16px;box-shadow:0 6px 0 #c9c2a8}
.timer{height:10px;border-radius:6px;background:#e7e2cf;overflow:hidden;margin-bottom:8px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#ffb703,#fb8500);width:100%}
.timer.over i{background:#bbb}
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:#7a7f99;margin-bottom:4px}
.qtag{background:#e8edff;color:#3a4bb5;padding:2px 10px;border-radius:10px}
.qtext{font-size:21px;line-height:1.45;margin:4px 0 6px;word-break:keep-all}
.fig{display:block;width:100%;max-width:420px;max-height:230px;margin:6px auto 10px;background:#fff;border:2px solid #ece6d2;border-radius:14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{font-size:20px;padding:14px 8px;background:#eef2ff;color:#1f2451;border:3px solid #c9d3ff;border-radius:16px;box-shadow:0 4px 0 #aab6ee;word-break:keep-all;transition:transform .06s}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 #aab6ee}
.choice.correct{background:#c9f7cf;border-color:#22a447;box-shadow:0 4px 0 #22a447}
.choice.wrong{background:#ffd3d3;border-color:#e23b3b;box-shadow:0 4px 0 #e23b3b}
.choice.gone{visibility:hidden}
.choice:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:18px;line-height:1.5;word-break:keep-all}
.fb.ok{background:#e3fbe6;color:#17602c}
.fb.no{background:#ffecec;color:#8f1d1d}
.fb .btn{margin-top:10px;width:100%}
.items{display:flex;gap:10px;margin:0 12px}
.items button{flex:1;border:none;border-radius:14px;padding:10px;font-size:17px;background:#2a3388;color:#fff;box-shadow:0 4px 0 #141a55}

/* 공용 */
.panel{background:#1c2361;border-radius:20px;margin:14px;padding:18px;box-shadow:0 5px 0 #0d1030}
.panel h2{margin:0 0 10px;font-weight:normal;color:#ffe06a;font-size:24px}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:#151b4f;border-radius:14px;margin-bottom:10px}
.row .big{font-size:40px}
.row .grow{flex:1}
.row .sub{font-size:14px;color:#aab6ee}
.anvil{font-size:90px;text-align:center;margin:6px 0}
.anvil.swing{animation:shake .25s 4}
.wname{text-align:center;font-size:26px;color:#ffe06a}
.wstat{text-align:center;color:#cfe0ff;margin:6px 0 14px;font-size:17px;line-height:1.6}
.cstat{margin-bottom:10px}
.cstat .lb{display:flex;justify-content:space-between;font-size:16px;margin-bottom:4px}
.cstat .bar{height:14px;background:#0d1030;border-radius:8px;overflow:hidden}
.cstat .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb703,#5dff8f)}
.note{background:#fffdf4;color:#2b2d42;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.note .q{font-size:18px;line-height:1.45;word-break:keep-all}
.note .a{color:#1d7a35;margin-top:6px;font-size:17px}
.note .x{color:#555;font-size:15px;margin-top:4px;line-height:1.5;word-break:keep-all}
.note .fig{max-height:170px}
.empty{text-align:center;color:#aab6ee;padding:20px;font-size:18px}

.modal-bg{position:fixed;inset:0;background:rgba(5,8,30,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:linear-gradient(#2a3390,#1c2361);border:3px solid #ffe06a;border-radius:24px;padding:22px 20px;max-width:420px;width:100%;text-align:center;animation:appear .3s}
.modal h3{margin:0 0 8px;font-weight:normal;font-size:28px;color:#ffe06a}
.modal p{font-size:18px;line-height:1.55;color:#e4e9ff;margin:8px 0;word-break:keep-all}
.modal .btns{display:flex;gap:10px;margin-top:16px}
.modal .btns .btn{flex:1;padding:12px 6px}
.bigstars{font-size:52px;letter-spacing:6px;margin:6px 0}
.bigstars span{display:inline-block;animation:appear .5s backwards}
.bigstars .off{filter:grayscale(1) brightness(.4)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0b0e2a;border:2px solid #ffe06a;padding:10px 18px;border-radius:14px;font-size:17px;z-index:60;animation:appear .25s;max-width:90%;text-align:center}
.lvup{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:58px;color:#ffe06a;text-shadow:0 5px 0 #b06f00,0 0 30px #fff3b0;z-index:55;pointer-events:none;animation:lvup 1.8s forwards;white-space:nowrap}
@keyframes lvup{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.2);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.spark{position:fixed;font-size:26px;z-index:54;pointer-events:none;animation:spark 1.2s forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
@media (max-width:560px){
 .classes{grid-template-columns:1fr}
 .cls{display:flex;align-items:center;gap:12px;text-align:left}
 .cls .e{font-size:44px}
 .unit{width:120px}.hpbar{width:104px}
 .unit .e{font-size:56px}.unit.mon .e{font-size:66px}.unit.mon.boss .e{font-size:88px}
 .arena{height:180px}
 .qtext{font-size:19px}.choice{font-size:18px}
 .res{font-size:14px;padding:5px 7px}
 .ava{width:46px;height:46px;font-size:30px}
}

/* ===== 그래픽 강화 ===== */
body{background:radial-gradient(ellipse at 50% -10%,#3a4bb5 0%,#1a1f55 45%,#0b0e2a 100%) fixed}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15}}
#app{z-index:1}
.logo,.wname,.modal h3,.sectit,.panel h2,.stage .nm,.tut h4,.banner{font-family:'Black Han Sans','Jua',sans-serif;letter-spacing:.5px}
.logo{font-size:52px}
.float{font-family:'Black Han Sans','Jua',sans-serif;-webkit-text-stroke:2px rgba(0,0,0,.75);paint-order:stroke fill}
.stage::before{content:'';position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.stage .clr{position:absolute;right:10px;bottom:10px;background:#ffe06a;color:#4a2a00;font-size:13px;padding:2px 8px;border-radius:8px;transform:rotate(-6deg)}
.helpbtn{display:block;margin:6px auto 0;border:2px solid #ffe06a;background:rgba(255,224,106,.12);color:#ffe06a;border-radius:20px;padding:6px 16px;font-size:16px}
.arena{background:#000}
.arena::after{display:none}
.arena .sky,.arena .hills,.arena .ground{position:absolute;left:0;right:0}
.arena .sky{top:0;bottom:0}
.arena .hills{bottom:44px;height:90px;width:100%}
.arena .ground{bottom:0;height:52px;box-shadow:inset 0 6px 10px rgba(0,0,0,.25)}
.arena .ground::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.25)}
.arena .deco{position:absolute;line-height:1;z-index:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.cloud{position:absolute;font-size:38px;opacity:.85;z-index:1;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1100px)}}
.unit{bottom:18px}
.unit .shadow{position:absolute;left:50%;bottom:22px;width:80px;height:16px;margin-left:-40px;border-radius:50%;background:rgba(0,0,0,.35);z-index:-1}
.unit.hero .body::before{content:'';position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,150,.55),rgba(255,240,150,0) 70%);animation:aura 2s ease-in-out infinite;z-index:-1}
.unit.mon.boss .body::before{content:'';position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(255,40,40,.55),rgba(255,40,40,0) 70%);animation:aura 1.2s ease-in-out infinite;z-index:-1}
.unit .body{position:relative}
@keyframes aura{50%{transform:scale(1.2);opacity:.6}}
.hpbar{height:16px;border:2px solid #111;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.hpbar::after{content:'';position:absolute;left:0;right:0;top:0;height:45%;background:rgba(255,255,255,.35)}
.hpbar b{font-size:11px;line-height:12px;text-shadow:0 1px 1px #000;z-index:1}
.unit .lbl{display:inline-block;background:rgba(0,0,0,.45);padding:1px 10px;border-radius:10px}
.proj{position:absolute;z-index:5;font-size:42px;line-height:1;pointer-events:none;transition:left .32s cubic-bezier(.4,0,.6,1),top .32s;filter:drop-shadow(0 0 8px #fff6a0)}
.burst{position:absolute;z-index:5;font-size:64px;pointer-events:none;animation:burst .45s forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.slash{position:absolute;z-index:5;width:120px;height:120px;border-radius:50%;border-top:8px solid #fff;border-right:8px solid rgba(255,255,255,.6);pointer-events:none;animation:slash .35s forwards;box-shadow:0 -6px 18px -6px #fff}
@keyframes slash{0%{transform:translate(-50%,-50%) rotate(-80deg) scale(.6);opacity:1}100%{transform:translate(-50%,-50%) rotate(60deg) scale(1.1);opacity:0}}
.ptc{position:absolute;z-index:5;font-size:18px;pointer-events:none;animation:ptc .6s forwards}
@keyframes ptc{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.banner{position:fixed;left:0;right:0;top:34%;z-index:45;text-align:center;font-size:54px;color:#fff;padding:14px 0;background:linear-gradient(90deg,transparent,rgba(20,24,80,.9) 20%,rgba(20,24,80,.9) 80%,transparent);text-shadow:0 4px 0 #000;pointer-events:none;animation:banner 1.5s forwards}
.banner small{display:block;font-size:22px;font-family:'Jua',sans-serif;color:#ffe06a}
.banner.boss{background:repeating-linear-gradient(-45deg,rgba(180,0,0,.92) 0 24px,rgba(40,0,0,.92) 24px 48px);color:#ffe06a}
@keyframes banner{0%{transform:translateX(-100%)}15%{transform:none}80%{transform:none;opacity:1}100%{transform:translateX(100%);opacity:0}}
.confetti{position:fixed;top:-40px;z-index:56;font-size:24px;pointer-events:none;animation:fall linear forwards}

/* ===== 그래픽 업그레이드: 판타지 카툰 ===== */
:root{--gold1:#fff1a8;--gold2:#ffc93c;--gold3:#d98e04;--gold4:#8a5300;--navy1:#2b3486;--navy2:#1a1f5c;--navy3:#0d1036;--line:#e7b94a}
body{background:radial-gradient(1200px 600px at 50% -200px,#3b2f8f 0,transparent 70%),radial-gradient(900px 500px at 100% 100%,#1b4b7a 0,transparent 60%),linear-gradient(#141844,#0a0c26) fixed}

/* 버튼 */
.btn{position:relative;background:linear-gradient(180deg,var(--gold1) 0%,var(--gold2) 45%,var(--gold3) 100%);color:#4a2600;border:2px solid var(--gold4);border-radius:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -3px 0 rgba(0,0,0,.18),0 5px 0 var(--gold4),0 8px 14px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.55);overflow:hidden}
.btn::after{content:'';position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 var(--gold4)}
.btn.blue{background:linear-gradient(#a5d8ff,#4dabf7 45%,#1c7ed6);border-color:#0b4f91;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 5px 0 #0b4f91,0 8px 14px rgba(0,0,0,.35)}
.btn.gray{background:linear-gradient(#dee2e6,#adb5bd 45%,#868e96);border-color:#495057;color:#212529;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 5px 0 #495057}
.btn.red{background:linear-gradient(#ffa8a8,#fa5252 45%,#c92a2a);border-color:#7d1414;color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #7d1414}

/* 패널 */
.panel{background:linear-gradient(180deg,rgba(43,52,134,.96),rgba(22,27,82,.97));border:2px solid var(--line);border-radius:20px;box-shadow:inset 0 0 0 2px rgba(13,16,54,.9),inset 0 0 0 4px rgba(231,185,74,.25),0 8px 20px rgba(0,0,0,.45)}
.panel h2{color:#ffe066;text-shadow:0 2px 0 #6b3d00,0 0 12px rgba(255,214,90,.35);letter-spacing:.5px}

/* 위쪽 HUD */
.hud{background:linear-gradient(#2e3793,#1b2163 60%,#141a4e);border-bottom:3px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.ava{border:3px solid var(--line)!important;background:radial-gradient(circle at 40% 35%,#ffffff,#cfe3ff 60%,#7aa7e8)!important;box-shadow:0 0 0 3px #141a4e,0 0 14px rgba(255,214,90,.45)}

/* 지도 카드 */
.stage{border:2px solid rgba(255,255,255,.55);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -40px 50px rgba(0,0,0,.25),0 6px 0 rgba(0,0,0,.4),0 10px 18px rgba(0,0,0,.35);transition:transform .12s}
.stage:not(.lock):hover{transform:translateY(-3px)}
.stage::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);pointer-events:none}
.stage.new::after{animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.stage .ic{filter:drop-shadow(0 4px 0 rgba(0,0,0,.25)) drop-shadow(0 0 10px rgba(255,255,255,.35));transform-origin:50% 80%;animation:icfloat 3s ease-in-out infinite}

.stage .nm{text-shadow:0 2px 0 rgba(0,0,0,.35)}

.wtab{background:linear-gradient(#323c9a,#1d2366);border:2px solid rgba(231,185,74,.45);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 4px 0 #0d1036}

const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const RSALT='sqrpg-2026-hs';
function hash6(str){let h1=0x811c9dc5,h2=0x1234567;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=Math.imul(h2+c,2654435761)>>>0}return ((h1^h2)>>>0).toString(36).toUpperCase().padStart(7,'0').slice(-6)}
const clean=t=>String(t).replace(/[|\n\r]/g,' ').trim();
function tstamp(ts){const d=new Date(ts||Date.now()),z=n=>String(n).padStart(2,'0');return String(d.getFullYear()).slice(2)+z(d.getMonth()+1)+z(d.getDate())+z(d.getHours())+z(d.getMinutes())}
function codeOf(r){const f=[clean(r.name),clean(r.stage),clean(r.diff),r.total,r.grade,r.right+'/'+r.n,tstamp(r.ts)];return `🏰사각형RPG|${f.join('|')}|${hash6(RSALT+f.join('|'))}`}
function copyCode(i){const r=S.log[i];if(!r)return;const code=codeOf(r);
 const done=()=>{r.sent=true;save();toast('📋 복사했어요! 선생님이 알려 준 곳에 붙여 넣어요',2600)};

 try{navigator.clipboard.writeText(code).then(done,manual)}catch(e){manual()}}
function parseCodes(txt){
 const re=/🏰사각형RPG\|([^|\n]+)\|([^|\n]+)\|([^|\n]+)\|(\d+)\|([SABCD])\|(\d+)\/(\d+)\|(\d{10})\|([0-9A-Z]{6})/g;let m,ok=0,bad=0,dup=0;
 while((m=re.exec(txt))){const f=m.slice(1,8).map((v,k)=>k===5?m[6]+'/'+m[7]:v).filter((_,k)=>k!==6);
  const fields=[m[1].trim(),m[2].trim(),m[3].trim(),m[4],m[5],m[6]+'/'+m[7],m[8]];
  if(hash6(RSALT+fields.join('|'))!==m[9]){bad++;continue}
  if(S.rank[m[9]]){dup++;continue}
  S.rank[m[9]]={name:fields[0],stage:fields[1],diff:fields[2],total:+fields[3],grade:fields[4],acc:fields[5],t:fields[6]};ok++}
 save();return{ok,bad,dup};
}

const TH=[

const walkable=t=>t===0||t===3||t===5;
function bfs(T,sx,sy,block,gateOk){
 const D=Array.from({length:MH},()=>Array(MW).fill(-1)),Q=[[sx,sy]];D[sy][sx]=0;
 while(Q.length){const [x,y]=Q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH||D[ny][nx]>=0)continue;const t=T[ny][nx];if(!(walkable(t)||(gateOk&&t===4)))continue;if(block&&block.has(nx+','+ny))continue;D[ny][nx]=D[y][x]+1;Q.push([nx,ny])}}
 return D;
}
function genField(i){
 const th=TH[i];
 for(let tries=0;tries<60;tries++){
  const T=Array.from({length:MH},(_,y)=>Array.from({length:MW},(_,x)=>(x===0||y===0||x===MW-1||y===MH-1)?1:0));
  for(let y=1;y<MH-1;y++)T[y][16]=1;T[GY][16]=4;
  if(th.water)for(let y=1;y<MH-1;y++){T[y][8]=2;T[y][9]=2}
  for(let y=1;y<MH-1;y++)for(let x=2;x<16;x++){if(T[y][x]!==0||(x<4&&Math.abs(y-GY)<2))continue;const r=Math.random();if(r<.19)T[y][x]=1;else if(th.lava&&r<.25)T[y][x]=2}
  for(let y=1;y<MH-1;y++)for(let x=17;x<MW-1;x++)if((y<3||y>MH-4)&&Math.random()<.4)T[y][x]=1;
  let x=1,y=GY;const P=[[x,y]];
  while(x<15){if(Math.random()<.35&&!(th.water&&(x===8||x===9))){const ny=y+pick([-1,1]);if(ny>1&&ny<MH-2)y=ny}else x++;P.push([x,y])}
  while(y!==GY){y+=Math.sign(GY-y);P.push([x,y])}
  P.forEach(([a,b])=>{if(T[b][a]===2)T[b][a]=5;else if(T[b][a]!==4)T[b][a]=3});
  if(th.water){const by=pick([2,3,9,10]);T[by][8]=5;T[by][9]=5}
  for(let a=17;a<20;a++)T[GY][a]=3;
  const reach=bfs(T,1,GY,null,true);
  const cand=[];for(let b=1;b<MH-1;b++)for(let a=3;a<16;a++)if(reach[b][a]>=0&&(T[b][a]===0||T[b][a]===3)&&reach[b][a]>3)cand.push([a,b]);
  if(cand.length<26)continue;
  const nb=(a,b)=>[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>walkable(T[b+dy][a+dx])).length;
  const side=shuffle(cand.filter(([a,b])=>T[b][a]===0&&nb(a,b)>=3));
  if(side.length<5)continue;
  const used=new Set(),take=(list,n,ok=()=>true)=>{const out=[];for(const p of list){const k=p[0]+','+p[1];if(out.length>=n)break;if(used.has(k)||!ok(p))continue;let near=false;for(const u of used){const [ux,uy]=u.split(',').map(Number);if(Math.abs(ux-p[0])+Math.abs(uy-p[1])<2)near=true}if(near)continue;used.add(k);out.push(p)}return out};
  const chests=take(side,2),npc=take(side,1)[0];
  if(chests.length<2||!npc)continue;
  const sign=[[2,GY-1],[2,GY+1],[3,GY-1],[3,GY+1]].find(([a,b])=>T[b][a]===0)||null;
  const blk=new Set([...chests,npc,...(sign?[sign]:[])].map(p=>p[0]+','+p[1]));
  const r2=bfs(T,1,GY,blk,true);
  if(r2[GY][16]<0)continue;
  const mons=take(shuffle(cand.filter(([a,b])=>a>=5&&r2[b][a]>=0)),4);
  if(mons.length<4)continue;
  const coins=take(shuffle(cand.filter(([a,b])=>r2[b][a]>=0)),8);
  const OV=T.map(row=>row.map(()=>pick(th.obs)));
  return{T,OV,start:[1,GY],boss:[19,GY],mons,chests,npc,coins,sign};
 }
 return genField(i);
}

/* 문제 수 맞춤: 캐릭터가 강해서 문제를 적게 풀어도, 약해서 많이 풀어도 같은 기준(20문제)으로 점수를 매겨요 */
const QSTD=20;
function qNorm(status){const raw=F.sc.base+F.sc.speed+F.sc.combo,n=F.right+F.wrong;if(F.tower||!n)return{k:1,raw};const k=QSTD/n;return{k:(status==='clear'?k:Math.min(1,k)),raw}}
function curScore(){const z=qNorm('play');return Math.round(z.raw*z.k*D().mul)}
function updScore(){const v=curScore().toLocaleString();['score','fscore'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=v})}
function makeReport(status){
 const n=F.right+F.wrong,acc=n?Math.round(F.right/n*100):0,hpPct=Math.max(0,Math.round(F.php/maxHp()*100));
 const bonus={clear:status==='clear'?200:0,perfect:status==='clear'&&F.wrong===0?300:0,hp:status==='clear'?hpPct*2:0,explore:F.coins*10+(F.sc.chest||0),tower:status==='tower'?F.wave*100:0};
 const z=qNorm(status),sb=Math.round(F.sc.base*z.k),ss=Math.round(F.sc.speed*z.k),sco=Math.round(F.sc.combo*z.k);const raw=sb+ss+sco+bonus.clear+bonus.perfect+bonus.hp+bonus.explore+bonus.tower,total=Math.round(raw*D().mul);
 const grade=status==='fail'?(acc>=70?'C':'D'):acc>=95?'S':acc>=85?'A':acc>=70?'B':acc>=50?'C':'D';
 const sec=Math.round((Date.now()-F.t0)/1000);
 const weak=Object.entries(F.cs).filter(([c,v])=>v.w>0).sort((a,b)=>b[1].w-a[1].w).map(([c])=>CNAME[c]);
 const rec={ts:Date.now(),at:new Date().toLocaleString('ko-KR'),name:S.name,d:F.d,diff:`${F.d+1}단계 ${DIFF[F.d].n}`,stage:F.tower?`무한의 탑 ${F.wave+1}층`:`${SNO(F.i)} · ${F.st.name}`,status,
  result:status==='clear'?'클리어':status==='fail'?'실패':`${F.wave}층 돌파`,total,grade,right:F.right,n,acc,maxCombo:F.maxCombo,sec,
  sc:{base:sb,speed:ss,combo:sco},qn:z.k!==1?QSTD:0,bonus,mul:DIFF[F.d].mul,cs:JSON.parse(JSON.stringify(F.cs)),weak:weak.slice(0,2),coins:F.coins,chests:F.chests};
 S.log.unshift(rec);S.log=S.log.slice(0,30);
 if(!S.bsc[F.i]||S.bsc[F.i].t<total)S.bsc[F.i]={t:total,d:F.d};
 save();if(GAS)sendOnline(rec);return rec;
}
const mmss=s=>`${Math.floor(s/60)}분 ${s%60}초`;
function reportTable(r){

 return `<div class="grade g-${r.grade}">${r.grade}</div><table class="bd">

 ${row('🏁 클리어 보너스',r.bonus.clear)}${row('💯 노미스 보너스',r.bonus.perfect)}${row('❤️ 남은 체력 보너스',r.bonus.hp)}${row('🗼 탑 오르기 보너스',r.bonus.tower)}
 <tr><td>${DIFF[r.d].e} 난이도 배율</td><td>×${r.mul}</td></tr><tr class="tot"><td>총점</td><td>${r.total.toLocaleString()}점</td></tr></table>
 ${r.qn?'<p class="sub" style="font-size:13px;margin:2px 0">푼 문제 수가 달라도 공평하도록 '+r.qn+'문제를 푼 것으로 맞춰 계산했어요.</p>':''}<p style="font-size:15px;margin:4px 0">정답 ${r.right}/${r.n} (${r.acc}%) · 최대 콤보 ${r.maxCombo} · ${mmss(r.sec)}${r.weak.length?'<br>더 연습할 개념: '+r.weak.join(', '):''}</p>`;

 draw();
}

 const nx=WDIM[Math.min(WDIM.length-1,wdim()+1)];

window.gateGo=function(){const cost=forgeCost();if(S.gold<cost)return;S.gold-=cost;save();GATE={n:0,ok:0,q:null};gateNext()};
function gateNext(){if(!GATE)return;if(GATE.n>=5)return gateEnd();let q=null;for(let t=0;t<5&&!q;t++){try{q=genQ('mix',GATE.q,0)}catch(e){q=null}}if(!q){GATE.n=5;GATE.ok=5;return gateEnd()}GATE.q=q;GATE.n++;
 modal(`<div class="gateq"><div class="gatehd">🌀 시련 ${GATE.n} / 5 · 맞힌 개수 <b>${GATE.ok}</b> ${'⭐'.repeat(GATE.ok)}</div><div class="qtext" style="font-size:20px;margin:8px 0">${q.q}</div>${q.svg?'<div class="fig">'+q.svg+'</div>':''}<div class="gch2">${q.choices.map((c,i)=>`<button class="choice" onclick="gateAns(${i})">${c}</button>`).join('')}</div></div>`)}

 if(ok){GATE.ok++;SFX.ok&&SFX.ok()}else SFX.fail();try{record(q,ok)}catch(e){}
 setTimeout(()=>{GATE.busy=0;if(GATE.ok>=4||GATE.n-GATE.ok>1){GATE.n=5}gateNext()},ok?700:1600)};

 if(!win){SFX.fail();showForge();return modal('<h3>💫 돌파 실패…</h3><div style="font-size:64px">🌀</div><p>아깝다! 문제 5개 중 4개를 맞혀야 해요.<br>기록 → 틀린 문제를 다시 보고 도전해 봐요!</p><div class="btns"><button class="btn gray" onclick="closeModal()">다음에</button><button class="btn" onclick="closeModal();gateStart()">다시 도전</button></div>')}
 S.wlv++;save();const d=wdim(),D=WDIM[d];showForge();
 const ov=document.createElement('div');ov.className='dimcut d'+d;ov.innerHTML=`<div class="dimring"></div><div class="dimw wdim d${d}"><span>${C().we}</span></div><div class="dimtx">${D.e} ${D.n} 돌파!</div><div class="dimsub">${D.d}</div>`;document.body.appendChild(ov);
